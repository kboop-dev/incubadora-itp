<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"> <!-- que Google no indexe el panel -->
  <title>Administración | Incubadora ITP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { azul: '#1b365d', guinda: '#611232', dorado: '#bc955c' } } } }</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50">
  <header id="site-header"></header>
  <main class="max-w-5xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-extrabold text-azul">Panel de administración</h1>
    <!-- Login: se muestra si no hay sesión -->
    <form id="login" class="card p-6 mt-6 max-w-sm space-y-3">
      <label class="block text-sm font-medium">Contraseña de administrador
        <input id="pw" type="password" required autocomplete="current-password" class="mt-1 w-full border rounded p-2"></label>
      <button class="btn">Entrar</button><p id="lerr" class="text-sm text-red-700" role="alert"></p>
    </form>
    <!-- Panel: se muestra con sesión -->
    <section id="panel" hidden>
      <div class="flex flex-wrap gap-2 mt-6" id="atabs"></div>
      <form id="aform" class="card p-5 mt-5 grid gap-3 sm:grid-cols-2"></form>
      <p id="amsg" class="text-sm mt-3" role="status"></p>
      <ul id="alist" class="mt-5 space-y-2"></ul>
      <button id="logout" class="mt-6 text-sm underline text-azul">Cerrar sesión</button>
    </section>
  </main>
  <footer id="site-footer" class="bg-[#0b1220] text-white mt-10"></footer>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
